name: Tests

# Runs the full test suite on every push and pull request. The suite is
# fully offline — F1 and endurance tests read the committed derived CSVs in
# data/derived/, so no FastF1 or DuckDB network access is needed.

on:
  push:
    branches: [main]
    paths-ignore:
      - "reports/**"
      - "**/*.md"
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite outgrew 20 minutes: the runs on cf04c45 and 3a0e94e were both
    # killed at 20m20s, which reads as "cancelled" rather than as a failure and
    # so quietly stopped gating anything. 45 leaves headroom without being
    # unbounded.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # The lock first, so the versions that produced the committed artifacts
        # are the ones the byte-comparison tests run against. requirements.txt
        # pins nothing, and a newer matplotlib or fonttools is enough on its own
        # to relay out a figure or re-subset an embedded font — which is why the
        # brief determinism checks failed here while passing on the machine the
        # briefs were generated on.
        #
        # Streamlit after, because tests/test_demo_app.py skips itself without
        # it and the demo goes back to being the one untested surface. It
        # installs on top of the pins without moving them.
        run: |
          pip install -r requirements.lock
          pip install "streamlit>=1.60"

      - name: Run test suite
        run: pytest -q
