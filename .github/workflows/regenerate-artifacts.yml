name: Artifact drift check

# Regenerates every artifact that is derived from **already-committed data** and
# fails if the result differs from what is committed.
#
# This is the check the project was missing, and its absence is why staleness
# kept being found by a human reading a number and doubting it: the multi-stop
# layer covering 31% of its own scope, per-class tables quoting a superseded
# refit, crew-rating p-values drifting after the slopes beneath them moved.
# Every one of those would have shown up here as a non-empty `git diff` the week
# it happened.
#
# The distinction that makes this safe to automate, and that the previous
# refresh workflow blurred:
#
#   INGESTION reaches the network and can change WHICH RACES EXIST. Re-running
#   it is a scope change, and a scope change belongs in a reviewed commit. That
#   stays in post-race-refresh.yml.
#
#   REGENERATION reads committed laps and recomputes fits, plans, reports and
#   audits. It is deterministic: same data in, byte-identical artifacts out. A
#   diff here means the code and the committed artifacts have parted company,
#   which is always worth knowing and never a surprise the data caused.
#
# It reports drift rather than committing a fix, because a diff can mean either
# "the artifacts are stale" or "someone changed an estimator" — and only a human
# knows which of those was intended.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC, ahead of the ingestion refresh
  workflow_dispatch: {}
  pull_request:
    paths:
      # Only when something that *produces* an artifact changes. A README edit
      # cannot cause drift, and a two-hour job on every PR would be ignored.
      - "src/degradation/**"
      - "src/simulator/**"
      - "src/safety_car/**"
      - "src/audit/**"
      - "src/reporting/**"
      - "src/data/**"
      - "scripts/run_*.py"

concurrency:
  group: artifact-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  f1:
    name: F1 layers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Track position
        run: python scripts/run_track_position.py
      - name: Degradation model
        run: python scripts/run_degradation.py
      - name: Simulator demo
        run: python scripts/run_simulator_demo.py
      - name: Per-decision audit
        run: python scripts/run_audit.py
      - name: Calendar-wide decision audit
        run: python scripts/run_systematic_audit.py
      - name: Undercut hypothesis test
        run: python scripts/run_undercut_hypothesis.py
      # Reads that script's decision table and the fitted slopes, so it runs
      # after both. Tests Salminen's position-keeping defence on the same 357
      # decisions; the published replay above is not touched.
      - name: Position-keeping defence against real decisions
        run: python scripts/run_d1_defence.py
      - name: Slope-bias check
        run: python scripts/run_slope_bias_check.py
      # Reads the fitted tyre slopes, so it runs after the degradation model.
      # Measures what Salminen's overcut inequality asks for at those rates:
      # the inequality is his, the slopes are measured here.
      - name: Overcut feasibility on measured slopes
        run: python scripts/run_overcut_feasibility.py

      - name: Report drift
        run: .github/scripts/report_drift.sh "F1"

  # Its own job because of the runtime: four Monte Carlo duels per decision at
  # 1,500 draws is roughly ninety minutes, which would not fit beside the rest
  # of the F1 layers inside one budget. Splitting it is better than excusing it
  # from the schedule, since an artifact that only regenerates when someone
  # remembers is an artifact that goes stale without anyone noticing.
  rival_selection:
    name: Rival-selection comparison
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Four rival-selection rules on the same decisions
        run: python scripts/run_rival_selection.py

      - name: Report drift
        run: .github/scripts/report_drift.sh "rival selection"

  endurance:
    name: Endurance layers
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fits, quality, transfer, traffic
        run: python scripts/run_endurance_models.py
      # Straight after the fits, because it is the accounting of what those
      # fits resolve: how many intervals contain zero, how many slopes come
      # out negative, and whether fuel and tyre age separate at all. One
      # report per championship, never a pooled endurance figure.
      - name: How much of each fit is resolved
        run: python scripts/run_endurance_resolution.py
      - name: Full-race stop plans
        run: python scripts/run_multistop.py
      - name: Per-class tables, all six classes
        run: python scripts/run_class_reports.py
      - name: Winner-versus-fuel-range audit
        run: python scripts/run_endurance_audit.py
      - name: Per-decision audit cases
        run: python scripts/run_endurance_audit_cases.py
      - name: Calendar-wide decision audit, every class
        run: python scripts/run_systematic_endurance_audit.py

      - name: Report drift
        run: .github/scripts/report_drift.sh "endurance"

  cross_series:
    name: Cross-series layers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Neutralisation calibration backtest
        run: python scripts/run_prediction_backtest.py
      - name: Generalisation audit
        run: python scripts/run_generalization_audit.py
      - name: Safety-car contamination check
        run: python scripts/run_sc_contamination_check.py
      - name: Fuel-limited sensitivity sweep
        run: python scripts/run_fuel_limited_sensitivity.py
      # Reads both audit tables, so it belongs here rather than in either
      # single-series job.
      - name: Baseline comparison
        run: python scripts/run_baseline_comparison.py
      - name: Formal tests and intervals
        run: python scripts/run_formal_tests.py
      - name: Where the evidence is thin
        run: python scripts/run_thin_evidence.py
      # Reads the multi-stop plans, so it runs after them. Answers the
      # circularity objection to Result 2 by measuring which term of the
      # optimiser's comparison actually orders the two regimes.
      - name: Which term decides the strategy regime
        run: python scripts/run_regime_decomposition.py
      # Reads every green-flag stop behind the per-race pit-loss medians, so it
      # runs after the multi-stop plans it classifies against.
      - name: Pit-loss measurement checks
        run: python scripts/run_pit_loss_checks.py
      # Last, because the figures read the artifacts every step above writes.
      # A figure that disagrees with its own data is the same defect as a
      # sentence that does, and it is harder to notice.
      - name: Headline figures
        run: python scripts/make_headline_figures.py
      - name: Supporting figures
        run: python scripts/make_supporting_figures.py
      # The manuscript quotes no number it did not derive; this is what makes
      # that true. A stale numbers.tex fails here rather than in a submitted PDF.
      - name: Paper numbers
        run: python scripts/make_paper_numbers.py

      - name: Report drift
        run: .github/scripts/report_drift.sh "cross-series"
