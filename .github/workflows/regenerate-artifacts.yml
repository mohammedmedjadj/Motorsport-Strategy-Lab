name: Artifact drift check

# Regenerates every artifact that is derived from **already-committed data** and
# fails if the result differs from what is committed.
#
# This is the check the project was missing, and its absence is why staleness
# kept being found by a human reading a number and doubting it: the multi-stop
# layer covering 31% of its own scope, per-class tables quoting a superseded
# refit, crew-rating p-values drifting after the slopes beneath them moved.
# Every one of those would have shown up here as a non-empty `git diff` the week
# it happened.
#
# The distinction that makes this safe to automate, and that the previous
# refresh workflow blurred:
#
#   INGESTION reaches the network and can change WHICH RACES EXIST. Re-running
#   it is a scope change, and a scope change belongs in a reviewed commit. That
#   stays in post-race-refresh.yml.
#
#   REGENERATION reads committed laps and recomputes fits, plans, reports and
#   audits. It is deterministic: same data in, byte-identical artifacts out. A
#   diff here means the code and the committed artifacts have parted company,
#   which is always worth knowing and never a surprise the data caused.
#
# It reports drift rather than committing a fix, because a diff can mean either
# "the artifacts are stale" or "someone changed an estimator" — and only a human
# knows which of those was intended.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC, ahead of the ingestion refresh
  workflow_dispatch: {}
  pull_request:
    paths:
      # Only when something that *produces* an artifact changes. A README edit
      # cannot cause drift, and a two-hour job on every PR would be ignored.
      - "src/degradation/**"
      - "src/simulator/**"
      - "src/safety_car/**"
      - "src/audit/**"
      - "src/reporting/**"
      - "src/data/**"
      - "scripts/run_*.py"

concurrency:
  group: artifact-drift-${{ github.ref }}
  cancel-in-progress: true

# Floating point that does not depend on the runner. GitHub assigns runners
# with different CPUs, and with the defaults numpy picks AVX-512 or AVX2 kernels
# and OpenBLAS splits a product across however many cores it finds, so the same
# fit came out different in the twelfth decimal from one run to the next -- and
# near-ties in the Monte Carlo argmins then flipped. Pinning one kernel family
# and one thread makes the arithmetic the same on every x86-64 machine with
# AVX2, including a developer's. CONTRIBUTING.md gives the same three lines for
# running a regeneration locally.
env:
  OPENBLAS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "Haswell"
  NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"

jobs:
  f1:
    name: F1 layers
    runs-on: ubuntu-latest
    # Raised from 90 when the transfer-ceiling sweep joined this job: twenty
    # stable-slope replicates per circuit is roughly twenty minutes on its own.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        # The lock, not requirements.txt. This job exists to prove that the
        # same data produces byte-identical artifacts, and requirements.txt
        # pins nothing: a newer matplotlib or fonttools relays out a figure
        # and re-subsets an embedded font, so the PDFs differ for a reason
        # that has nothing to do with the data. That is what made the brief
        # determinism checks fail here while passing locally.
        run: pip install -r requirements.lock

      - name: Track position
        run: python scripts/run_track_position.py
      - name: Degradation model
        run: python scripts/run_degradation.py
      - name: Simulator demo
        run: python scripts/run_simulator_demo.py
      - name: Per-decision audit
        run: python scripts/run_audit.py
      - name: Calendar-wide decision audit
        run: python scripts/run_systematic_audit.py
      # Reads that audit's decisions and replays the multi-stop ones with the
      # team's own second stop as the end of the stint, so it runs after it.
      - name: The audit with each team's strategy held fixed
        run: python scripts/run_committed_strategy.py
      - name: Undercut hypothesis test
        run: python scripts/run_undercut_hypothesis.py
      # Reads that script's decision table and the fitted slopes, so it runs
      # after both. Tests Salminen's position-keeping defence on the same 357
      # decisions; the published replay above is not touched.
      - name: Position-keeping defence against real decisions
        run: python scripts/run_d1_defence.py
      - name: Slope-bias check
        run: python scripts/run_slope_bias_check.py
      # Reads the same frames as the degradation model and re-runs the transfer
      # protocol against synthetic stable-slope races, so it belongs after it.
      # The cost of leaving it out of the schedule is the one this workflow was
      # built to stop: an artifact that only regenerates when someone remembers.
      - name: What a stable slope could have scored
        run: python scripts/run_transfer_ceiling.py
      # Refits each circuit to read its own residuals by tyre age, so it runs
      # after the degradation model. Tests the fourth candidate explanation for
      # Result 3 -- that the slope misprices a fresh tyre -- and finds it has
      # the opposite sign.
      - name: What the slope misses at low tyre age
        run: python scripts/run_fresh_tyre.py
      # Reads the fitted tyre slopes, so it runs after the degradation model.
      # Measures what Salminen's overcut inequality asks for at those rates:
      # the inequality is his, the slopes are measured here.
      - name: Overcut feasibility on measured slopes
        run: python scripts/run_overcut_feasibility.py
      # Reads the transfer ceiling's per-circuit degree, so it runs after it.
      # Recodes every lap to the compound Pirelli supplied (the committed
      # table in data/reference/) and reruns the Result 1 protocol.
      - name: Relative labels against the real compound
        run: python scripts/run_compound_identity.py
      # Reads the committed practice laps; fetch_practice_laps.py, which
      # downloads them, is not run here because this job must not need the
      # network to reproduce what is committed.
      - name: Friday long runs as a predictor of Sunday
        run: python scripts/run_practice_long_runs.py
      # Reads the committed-strategy replay's planner lap and predicted cost.
      - name: What leaving the planner's lap cost in the races
        run: python scripts/run_deviation_cost.py
      # Reads the committed replay and the rival and defence audits.
      - name: Rejected mechanisms retested on the one-stop gap
        run: python scripts/run_one_stop_retest.py
      # Reruns the committed replay at three lookbacks on the whole field and
      # splits the gap by slope-ratio precision (about three minutes).
      - name: Design checks on the committed audit
        run: python scripts/run_audit_design_checks.py
      # Reads the design-check decisions: the implied ratio by the direction of
      # the compound change (seconds).
      - name: Implied ratio by direction of the compound change
        run: python scripts/run_implied_direction.py
      # The 2026 races already ingested, replayed with the frozen pre-2026
      # models: out of sample, not pre-registered (under a minute).
      - name: 2026 races replayed out of sample
        run: python scripts/run_heldout_2026.py
      # Reads the transfer ceiling for its verdicts and ceiling scores.
      - name: Result 1 baselines and traffic-trim sensitivity
        run: python scripts/run_transfer_baselines.py
      - name: Estimability of every reported coefficient
        run: python scripts/run_estimability.py
      # Race-clustered intervals, fuel-by-age interaction and refuelling share.
      # Reads the design checks above and committed endurance stop events.
      - name: Estimation checks
        run: python scripts/run_estimation_checks.py

      - name: Report drift
        run: .github/scripts/report_drift.sh "F1"
      # On drift, keep what CI regenerated so it can be inspected and, when
      # the difference is the runner's floating point rather than the code,
      # committed as the reference. Without it the only record is a file list.
      - name: Keep the regenerated files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drift-f1
          path: |
            data/derived
            reports
          retention-days: 14

  # Its own job because of the runtime: four Monte Carlo duels per decision at
  # 1,500 draws is roughly ninety minutes, which would not fit beside the rest
  # of the F1 layers inside one budget. Splitting it is better than excusing it
  # from the schedule, since an artifact that only regenerates when someone
  # remembers is an artifact that goes stale without anyone noticing.
  rival_selection:
    name: Rival-selection comparison
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        # The lock, not requirements.txt. This job exists to prove that the
        # same data produces byte-identical artifacts, and requirements.txt
        # pins nothing: a newer matplotlib or fonttools relays out a figure
        # and re-subsets an embedded font, so the PDFs differ for a reason
        # that has nothing to do with the data. That is what made the brief
        # determinism checks fail here while passing locally.
        run: pip install -r requirements.lock

      - name: Four rival-selection rules on the same decisions
        run: python scripts/run_rival_selection.py

      - name: Report drift
        run: .github/scripts/report_drift.sh "rival selection"
      # On drift, keep what CI regenerated so it can be inspected and, when
      # the difference is the runner's floating point rather than the code,
      # committed as the reference. Without it the only record is a file list.
      - name: Keep the regenerated files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drift-rival-selection
          path: |
            data/derived
            reports
          retention-days: 14

  endurance:
    name: Endurance layers
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        # The lock, not requirements.txt. This job exists to prove that the
        # same data produces byte-identical artifacts, and requirements.txt
        # pins nothing: a newer matplotlib or fonttools relays out a figure
        # and re-subsets an embedded font, so the PDFs differ for a reason
        # that has nothing to do with the data. That is what made the brief
        # determinism checks fail here while passing locally.
        run: pip install -r requirements.lock

      - name: Fits, quality, transfer, traffic
        run: python scripts/run_endurance_models.py
      # Straight after the fits, because it is the accounting of what those
      # fits resolve: how many intervals contain zero, how many slopes come
      # out negative, and whether fuel and tyre age separate at all. One
      # report per championship, never a pooled endurance figure.
      - name: How much of each fit is resolved
        run: python scripts/run_endurance_resolution.py
      - name: Full-race stop plans
        run: python scripts/run_multistop.py
      - name: Per-class tables, all six classes
        run: python scripts/run_class_reports.py
      - name: Winner-versus-fuel-range audit
        run: python scripts/run_endurance_audit.py
      - name: Per-decision audit cases
        run: python scripts/run_endurance_audit_cases.py
      - name: Calendar-wide decision audit, every class
        run: python scripts/run_systematic_endurance_audit.py
      - name: The endurance audit with each team's strategy held fixed
        run: python scripts/run_committed_strategy_endurance.py
      # The stable-slope ceiling for every endurance circuit-class (about ten
      # minutes). Reads the leave-one-season-out table written above.
      - name: Endurance noise ceiling
        run: python scripts/run_endurance_ceiling.py

      - name: Report drift
        run: .github/scripts/report_drift.sh "endurance"
      # On drift, keep what CI regenerated so it can be inspected and, when
      # the difference is the runner's floating point rather than the code,
      # committed as the reference. Without it the only record is a file list.
      - name: Keep the regenerated files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drift-endurance
          path: |
            data/derived
            reports
          retention-days: 14

  cross_series:
    name: Cross-series layers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        # The lock, not requirements.txt. This job exists to prove that the
        # same data produces byte-identical artifacts, and requirements.txt
        # pins nothing: a newer matplotlib or fonttools relays out a figure
        # and re-subsets an embedded font, so the PDFs differ for a reason
        # that has nothing to do with the data. That is what made the brief
        # determinism checks fail here while passing locally.
        run: pip install -r requirements.lock

      - name: Neutralisation calibration backtest
        run: python scripts/run_prediction_backtest.py
      - name: Generalisation audit
        run: python scripts/run_generalization_audit.py
      - name: Safety-car contamination check
        run: python scripts/run_sc_contamination_check.py
      - name: Fuel-limited sensitivity sweep
        run: python scripts/run_fuel_limited_sensitivity.py
      # Reads both audit tables, so it belongs here rather than in either
      # single-series job.
      - name: Baseline comparison
        run: python scripts/run_baseline_comparison.py
      - name: Formal tests and intervals
        run: python scripts/run_formal_tests.py
      - name: Where the evidence is thin
        run: python scripts/run_thin_evidence.py
      # Reads the multi-stop plans, so it runs after them. Answers the
      # circularity objection to Result 2 by measuring which term of the
      # optimiser's comparison actually orders the two regimes.
      - name: Which term decides the strategy regime
        run: python scripts/run_regime_decomposition.py
      - name: Variance and leave-one-out of the regime index
        run: python scripts/run_regime_index.py
      # Reads every green-flag stop behind the per-race pit-loss medians, so it
      # runs after the multi-stop plans it classifies against.
      - name: Pit-loss measurement checks
        run: python scripts/run_pit_loss_checks.py
      # Reads the multi-stop plans and the endurance slope intervals. Asks
      # whether Result 2's AUC gap is the slope being measured less precisely.
      - name: Regime separation against slope precision
        run: python scripts/run_regime_precision.py
      # Reads both audit tables, so it belongs beside the baseline comparison
      # rather than in either single-series job. Publishes the race-clustered
      # interval the audit median was previously reported without, and recomputes
      # Result 2's separation inside each class.
      - name: Race-clustered audit intervals and the within-class regime check
        run: python scripts/run_audit_intervals.py
      # Reads committed F1 laps, the transfer and endurance ceilings and the
      # committed audits: between-race variance of the slopes, track
      # temperature, first-stint slopes, extrapolation, GT3 paired by event.
      - name: Identification checks
        run: python scripts/run_identification_checks.py
      # Reads the variance components above, so it runs after them. Replays the
      # committed audit with slopes the decision's season never saw.
      - name: Committed audit out of sample
        run: python scripts/run_audit_out_of_sample.py
      - name: Ratio-one rule and green-flag stops
        run: python scripts/run_reference_rules.py
      # Refits every circuit's slopes in each bootstrap replicate (a minute
      # and a half).
      - name: Stop hazard
        run: python scripts/run_stop_hazard.py
      # Reads the season slopes and the compound identity table written above:
      # real compound coding, unchanged nominations, net slope, REML (three
      # minutes).
      - name: Between-race variance under three objections
        run: python scripts/run_tau_robustness.py
      # Last, because the figures read the artifacts every step above writes.
      # A figure that disagrees with its own data is the same defect as a
      # sentence that does, and it is harder to notice.
      - name: Headline figures
        run: python scripts/make_headline_figures.py
      - name: Supporting figures
        run: python scripts/make_supporting_figures.py
      # The manuscript quotes no number it did not derive; this is what makes
      # that true. A stale numbers.tex fails here rather than in a submitted PDF.
      - name: Paper numbers
        run: python scripts/make_paper_numbers.py

      - name: Report drift
        run: .github/scripts/report_drift.sh "cross-series"
      # On drift, keep what CI regenerated so it can be inspected and, when
      # the difference is the runner's floating point rather than the code,
      # committed as the reference. Without it the only record is a file list.
      - name: Keep the regenerated files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drift-cross-series
          path: |
            data/derived
            reports
          retention-days: 14
